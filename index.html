  <script>(() => {
  const form = document.getElementById('unlockForm');
  const input = document.getElementById('pagePassword');
  const status = document.getElementById('unlockStatus');
  const button = form.querySelector('button');
  const lockedPage = document.getElementById('unlock');
  const encoder = new TextEncoder();

  function decode(base64) {
    return Uint8Array.from(atob(base64), value => value.charCodeAt(0));
  }

  async function decrypt(password) {
    const envelope = JSON.parse(document.getElementById('encryptedSnapshot').textContent);
    if (envelope.version !== 1 || envelope.iterations !== 600000) {
      throw Error('不支持的数据版本。');
    }
    const passwordKey = await crypto.subtle.importKey(
      'raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey({
      name: 'PBKDF2', hash: 'SHA-256', salt: decode(envelope.salt), iterations: envelope.iterations
    }, passwordKey, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    const bytes = await crypto.subtle.decrypt(
      {name: 'AES-GCM', iv: decode(envelope.iv)}, key, decode(envelope.ciphertext)
    );
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  async function showDashboard(snapshot) {
    const page = new DOMParser().parseFromString(snapshot.html, 'text/html');
    for (const element of page.body.querySelectorAll('script')) element.remove();
    const body = document.importNode(page.body, true);
    // The app binds controls on startup. Keep their IDs but hide owner-only controls.
    for (const selector of [
      '#sourceButton', '#helpButton', '#importButton', '#folderTip', '#refreshButton',
      '#exportButton', '#dataDialog', '.password-settings'
    ]) {
      const element = body.querySelector(selector);
      if (element) element.hidden = true;
    }
    const logout = body.querySelector('.password-logout');
    logout?.removeAttribute('action');
    logout?.addEventListener('submit', event => {
      event.preventDefault();
      location.reload();
    });
    body.dataset.passwordSite = 'true';
    const style = document.createElement('style');
    style.textContent = snapshot.css;
    const dataUrl = URL.createObjectURL(new Blob([snapshot.dataModule], {type: 'text/javascript'}));
    const appSource = snapshot.app.replace(/(from\s+)['"]\.\/data\.js['"]/, '$1'+JSON.stringify(dataUrl));
    const appUrl = URL.createObjectURL(new Blob([appSource], {type: 'text/javascript'}));

    document.body.replaceWith(body);
    document.head.append(style);
    document.title = page.title || '观数 · 数据看板';
    globalThis.guanshuPublishedSnapshot = snapshot.content;
    try {
      await import(appUrl);
    } catch (error) {
      document.body.replaceChildren(lockedPage);
      document.body.removeAttribute('data-password-site');
      style.remove();
      document.title = '观数 · 访问看板';
      throw error;
    } finally {
      delete globalThis.guanshuPublishedSnapshot;
      URL.revokeObjectURL(appUrl);
      URL.revokeObjectURL(dataUrl);
    }
  }

  if (!globalThis.crypto?.subtle) return;
  form.hidden = false;
  status.textContent = '';
  form.addEventListener('submit', async event => {
    event.preventDefault();
    button.disabled = true;
    status.textContent = '正在解锁…';
    const password = input.value;
    input.value = '';
    try {
      const snapshot = await decrypt(password);
      await showDashboard(snapshot);
    } catch (error) {
      status.textContent = error.name === 'OperationError'
        ? '密码不正确，请重试。'
        : '看板加载失败，请刷新后重试。';
      input.focus();
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
